name: Recording evidence inspection
on:
  pull_request:
    paths: [".github/workflows/android.yml"]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: >-
      github.repository == 'BananaJeanss/solsleep' &&
      github.event.pull_request.head.repo.full_name == 'BananaJeanss/solsleep' &&
      github.head_ref == 'inspection/recording-reports'
    strategy:
      fail-fast: false
      matrix:
        api: [29, 37]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          repository: BananaJeanss/solsleep
          run-id: 39173248195
          name: api-${{ matrix.api }}-device-results
          path: prior-reports
          github-token: ${{ github.token }}
      - name: Expose original native receipt capture for review
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          root = Path("prior-reports")
          paths = list(root.rglob("recording-export-history-large-text.png"))
          if len(paths) != 1:
              print("CAPTURE_PATHS=" + json.dumps([str(p) for p in root.rglob("*.png")][:40]))
              for log in root.rglob("device-logcat.txt"):
                  lines = log.read_text(errors="replace").splitlines()
                  hits = [i for i, line in enumerate(lines) if "MotionCaptureTest.setup(" in line]
                  print("SETUP_STACK_HITS=", len(hits))
                  for i in hits[:2]:
                      for line in lines[max(0, i-8):i+12]:
                          print("|", line)
              raise SystemExit("Expected exactly one original receipt screenshot")
          path = paths[0]
          if path.is_symlink() or path.stat().st_size > 1024 * 1024:
              raise SystemExit("Unexpected capture file")
          data = path.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Not an original PNG")
          print("CAPTURE_META=" + json.dumps(dict(path=str(path), bytes=len(data),
              sha256=hashlib.sha256(data).hexdigest(),
              gitBlobSha=hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest())))
          print("CAPTURE_BYTES=" + base64.b64encode(data).decode())
          PY
